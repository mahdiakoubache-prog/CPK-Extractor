name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore CPKExtractor.csproj

      - name: Build APK
        run: dotnet publish CPKExtractor.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Find APK
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path "bin/Release/net10.0-android" -Filter "*.apk" -Recurse |
            Where-Object { $_.Name -notlike "*-aligned.apk" } |
            Select-Object -First 1
          if (-not $apk) { throw "No APK produced by the build." }
          "APK_PATH=$($apk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CPK-Extractor-Android
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
